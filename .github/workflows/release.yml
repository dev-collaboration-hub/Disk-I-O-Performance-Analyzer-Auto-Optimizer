name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.ref == 'refs/heads/main' && github.event.head_commit.message == 'Publish v1.0.0 release')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip ".[release]"
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG="v${VERSION}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            test "${GITHUB_REF_NAME}" = "${TAG}"
          else
            test "${TAG}" = "v1.0.0"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
      - run: python scripts/release_check.py
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.release.outputs.tag }}
          path: dist/*
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; nothing to do."
            exit 0
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            gh release create "${TAG}" dist/* --generate-notes --verify-tag
          else
            gh release create "${TAG}" dist/* --target "${GITHUB_SHA}" --title "${TAG}" --generate-notes
          fi
